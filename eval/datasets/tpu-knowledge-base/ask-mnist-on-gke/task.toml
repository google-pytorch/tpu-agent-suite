version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "tpu-knowledge-base/ask-mnist-on-gke"
description = "Answer this question about `torch-tpu-get-started-gke`, grounded in the TPU documentation, passing it exactly as written: \"Which job manifest does the torch_tpu GKE guide use to run the upstream PyTorch MNIST example on a single TPU device, and what changes does mnist/main.py need?\" Answer clearly, citing any references you can for grounding. Drop a JSON at `/logs/artifacts/answer.json` with keys `answer` and `reference`, for scoring."

[metadata]
category = "tpu-knowledge-base"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
