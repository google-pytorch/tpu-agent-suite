version = "1.0"

[task]
name = "smoke-check/preflight-check-smoke-check"
description = "Run preflight check on Qwen/Qwen2.5-7B-Instruct using preflight_check."

[metadata]
category = "smoke-check"

# Successful CI runs took 1-4.5 min, with Antigravity's delegation to
# tpu-model-onboarding at the slow end; 300 s timed out on the slow tail.
[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0

[environment]
skills_dir = "/workspace/skills"
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
build_timeout_sec = 900.0

[environment.env]
TASK_AGENT_PERSONA = "tpu-model-onboarding"
