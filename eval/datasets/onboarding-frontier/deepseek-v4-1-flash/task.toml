schema_version = "1.4"

[task]
name = "onboarding-frontier/deepseek-v4-1-flash"

[environment]
# No docker_image: environment/Dockerfile is the image. Harbor's GKE path
# never reads this key (run.py:286) -- it builds from environment/ and
# resolves the pod image by content hash -- so a pin here would name
# something nothing pulls.
cpus = 2
memory_mb = 65536
storage_mb = 102400
env = { HF_MODEL_URL = "https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash" }

[agent]
# Long, and deliberately so: the deliverable is a vLLM server serving the model
# on a v6e or v7 slice, reached through a queue, plus a full concurrency sweep
# and a commit history. 6h base timeout (x3 timeout_multiplier = 18h on remote GKE).
timeout_sec = 21600.0

[verifier]
# The verifier itself takes seconds since its table scan stopped using a
# backtracking regex (that is what ran out 900s in gh-37846954460 and 1800s
# in gh-37886752705). This is a safety net for a large /workspace or a
# stalled exec: x3 timeout_multiplier, 90 minutes.
timeout_sec = 1800.0
env = { HF_MODEL_URL = "https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash" }
