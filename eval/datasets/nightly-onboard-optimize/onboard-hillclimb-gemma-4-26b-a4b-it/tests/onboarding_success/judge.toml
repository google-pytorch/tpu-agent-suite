# Scoring framework: Phase 1 onboarding definition of done: a vLLM server on TPU,
# a coherent completion over HTTP, measured baseline benchmark tables, exact
# reproduction commands, and cluster job teardown. all-pass: every criterion
# must pass, so this dimension is 0 or 1.

[judge]
judge = "vertex_ai/gemini-3.8-flash"
reasoning_effort = "high"
atif-trajectory = "/logs/agent/trajectory.json"
files = [
  "/logs/artifacts/onboarding",
  "/logs/artifacts/hillclimb",
  "/logs/artifacts/tpu-model-onboarding",
  "/logs/artifacts/tpu-serving-bench",
  "/logs/artifacts/tpu-diagnostics",
  "/logs/artifacts/tpu-kernel-development",
  "/logs/artifacts/tpu-performance-optimization",
  "/logs/artifacts",
]
timeout = 600

[[criterion]]
name = "vllm_server_on_tpu"
type = "binary"
weight = 1.0
description = "Phase 1 Definition of done 1: a vLLM server serving google/gemma-4-26B-A4B-it ran on TPU hardware (matching the environment's configured TPU slice or a valid TPU slice selected on the cluster for the model's memory footprint), using torch_tpu. Fails if the model was served by anything other than vLLM (a standalone inference script, a toy HTTP wrapper such as FastAPI, http.server or Flask, or an unbatched single-stream loop), if it used torch_xla / pytorch_xla or the tpu-inference repo, or if it ran anywhere other than on TPU. It must appear in tool output in the trajectory, and the attached artifact files must record it; the agent's own claim or its final report alone does not count. Cite the Step IDs of the vLLM launch and of the output showing it serving on TPU."

[[criterion]]
name = "completion_over_http"
type = "binary"
weight = 1.0
description = "Phase 1 Definition of done 2: the vLLM server for google/gemma-4-26B-A4B-it answered a completion request over HTTP with coherent output: text that follows from the prompt, not an empty completion, garbage, a run of repeated tokens or punctuation, or an error. Both the request and the response must be shown and saved in the attached artifact files, and must appear in tool output in the trajectory; the agent's own claim or its final report alone does not count. Cite the Step IDs and quote the request and the response."

[[criterion]]
name = "baseline_benchmarks_reported"
type = "binary"
weight = 1.0
description = "Phase 1 Definition of done 3 & paired baseline sweep: the unmodified Phase 1 vLLM server for google/gemma-4-26B-A4B-it was benchmarked over HTTP, including measured baseline performance tables saved in the attached artifact files (e.g. onboarding/REPORT.md or specialist REPORT.md) and the baseline 8k/1k concurrency sweep (1, 2, 4, ... doubling until per-chip output throughput gains fall under 10% or requests fail/OOM), with TTFT, ITL, and output throughput recorded from real benchmark runs in the trajectory. Points that could not run pass if recorded in the failure table rather than silently fabricated. Fails if numbers are estimated, invented, or have no matching benchmark output in the trajectory. Cite the Step IDs of the baseline benchmark runs and quote the peak baseline throughput."

[[criterion]]
name = "baseline_reproduce_commands"
type = "binary"
weight = 1.0
description = "Phase 1 Definition of done 4: the agent gave the exact commands to reproduce the baseline from scratch (deploying the vLLM server for google/gemma-4-26B-A4B-it on TPU and running the baseline benchmark), and they match what it actually ran in the trajectory. They must be saved in the attached artifact files (including serving_bench_request.json replay records when delegated to tpu-serving-bench). Fails if no commands were given, or they are incomplete or differ from what was run. Cite the Step IDs."

[[criterion]]
name = "no_stale_servers"
type = "binary"
weight = 1.0
description = "By the end of the run, every job the agent started on the cluster was cancelled or had finished: failed server attempts, check and benchmark jobs, and the final server. Each must show a cancel or a terminal status in tool output in the trajectory, and each row of job_log.md (if attached) must have an end time. Fails if any server job the agent started is left running at the end, or if job_log.md omits active jobs started in the trajectory. Cite the Step IDs of each cancel."

[scoring]
aggregation = "all-pass"
