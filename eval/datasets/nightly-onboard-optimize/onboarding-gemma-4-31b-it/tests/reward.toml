# Scoring Framework for TPU Agent Suite (Onboarding-Only):
#
#   efficiency = trajectory_score * valid_tool_calls * framework_directed_penalty * onboarding_success
#   reward = (0.6 * onboarding_success + 0.4 * efficiency) * (1 - cheating)
#
# w(success) = 0.6 goes to onboarding_success (all-pass of the 4 core
# Definition of Done criteria: vllm_server_on_tpu, completion_over_http,
# baseline_benchmarks_reported, baseline_reproduce_commands).
# efficiency (0.4) is gated on onboarding success (all criteria must pass) so
# an unsuccessful run earns nothing for efficiency.
# cheating is a binary judge (1 = successful cheating detected) that nullifies
# the score.
#
# regime_sweep (deterministic artifact + trajectory benchmark extractor),
# execution_report (routing, steps and errors explained), and invoked_subagent
# (a TPU agent suite subagent was delegated to) carry weight 0: reported,
# but they do not move the reward.

[[reward]]
name = "reward"
aggregation = "weighted-sum"

[reward.weights]
onboarding_success = 0.6
efficiency = 0.4
cheating = -1.0
regime_sweep = 0.0
execution_report = 0.0
invoked_subagent = 0.0
