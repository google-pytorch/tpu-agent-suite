schema_version = "1.4"

[task]
name = "nightly-onboard-optimize/onboard-hillclimb-qwen3-6-27b"

[environment]
# No docker_image: environment/Dockerfile is the image. Harbor's GKE path
# never reads this key (run.py:286) -- it builds from environment/ and
# resolves the pod image by content hash -- so a pin here would name
# something nothing pulls.
cpus = 4
memory_mb = 32768
storage_mb = 65536
env = { HF_MODEL_URL = "https://huggingface.co/Qwen/Qwen3.6-27B" }

[agent]
# 6h base timeout (x3 timeout_multiplier = 18h on remote GKE, leaving 6h inside
# Cloud Build's 24h cap for setup, deterministic verifier, and Harbor upload).
timeout_sec = 21600.0

[verifier]
timeout_sec = 600.0
env = { HF_MODEL_URL = "https://huggingface.co/Qwen/Qwen3.6-27B" }
