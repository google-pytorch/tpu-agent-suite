version = "1.0"

[task]
name = "tpu-inference-vllm/tpu-inference-gpt-oss-20b-vllm"
description = "Verify inference for openai/gpt-oss-20b on TPU in verification mode: vLLM with the launch-time MXFP4 patch, non-degenerate output, then teardown."

[metadata]
category = "tpu-inference-vllm"

[agent]
# Startup alone is about 8.5 to 10.5 minutes to the API server banner
# (vllm-gpt-oss-mxfp4 playbook), on top of planning, the compatibility check, and kernel optimization.
# 6h base timeout (x3 timeout_multiplier = 18h on remote GKE).
timeout_sec = 21600.0

[verifier]
# LLM judges (with retries) for every scoring dimension, not one check.
timeout_sec = 2400.0

[environment]
skills_dir = "/workspace/skills"
workdir = "/workspace"
cpus = 2
memory_mb = 65536
storage_mb = 102400
