version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "nightly-functional/tpu-diagnostics"
description = "`inputs/trace` contains an XProf trace of a transformer training step on TPU v6e."

[metadata]
category = "nightly-functional"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0

[environment]
skills_dir = "/workspace/skills"
workdir = "/workspace"
cpus = 2
memory_mb = 4096
storage_mb = 10240
