version = "1.0"

[task]
name = "nightly-functional/preflight-ambiguous-name"
description = "tpu-model-onboarding gets the loose name \"llama 3 8b\": preflight's --resolve reports it ambiguous, and the user is asked which repository, with linked candidates, before any check runs on a guess."

[metadata]
category = "nightly-functional"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0

[environment]
skills_dir = "/workspace/skills"
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240

[environment.env]
TASK_AGENT_PERSONA = "tpu-model-onboarding"
