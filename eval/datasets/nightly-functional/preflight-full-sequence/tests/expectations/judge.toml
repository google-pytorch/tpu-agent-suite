[judge]
judge = "vertex_ai/gemini-3.8-flash"
atif-trajectory = "/logs/agent/trajectory.json"
timeout = 600

[[criterion]]
description = "The final report to the user gives preflight's verdict for openai/gpt-oss-20b (compatible, or which check failed and why) and notes that preflight passed its MXFP4 quantization config rather than rejecting it. The report needs only the reason for the mode that ran, in any wording: for an inference check, that the vLLM TorchTPU plugin serves mxfp4; for a benchmark check, a 'Verify TPU support' warning. It need not explain the other mode. The judge must cite the Step ID of the final report."
type = "binary"
weight = 1.0

[[criterion]]
description = "The report states what the task image carries, from the image probe: the torch_tpu version, and the torch and transformers versions, plus the vllm, vllm_torchtpu and jax versions for each of those the probe's `distributions` lists. For an inference check, a missing vllm, vllm_torchtpu or jax may be named as not installed instead. When the probe's `dependencies.vllm_stack.verdict` is `untested` or `broken`, the report says so. The judge must cite the Step ID where these versions appear."
type = "binary"
weight = 1.0

[[criterion]]
description = "The work stayed within a preflight check: no model was deployed, served or benchmarked, and no inference or benchmark script was written."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
