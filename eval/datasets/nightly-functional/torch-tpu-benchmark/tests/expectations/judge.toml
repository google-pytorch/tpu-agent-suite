[judge]
judge = "vertex_ai/gemini-3.8-flash"
atif-trajectory = "/logs/agent/trajectory.json"
timeout = 600

[[criterion]]
description = "Verifies that the benchmark workflow executed successfully on Cloud TPU (not a failed run, crash, or mock/stub). The run must produce valid benchmark metrics (such as throughput, latency, duration, or speedup) for HuggingFaceTB/SmolLM2-135M-Instruct. The judge must cite the exact turn number (Step ID) where the benchmark completed and report the measured results (e.g., duration/latency/throughput numbers) in its reasoning."
type = "binary"
weight = 1.0

[[criterion]]
description = "Verifies that the agent delivered a comprehensive final report to the user in the concluding turn of the conversation, summarizing the benchmark results, metrics, and artifact locations (rather than timing out or crashing). The judge must cite the exact turn number (Step ID) of the agent's final report to the user."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
