[judge]
judge = "vertex_ai/gemini-3.8-flash"
atif-trajectory = "/logs/agent/trajectory.json"
timeout = 600

[[criterion]]
description = "Verifies that the agent executed a numerical parity check for HuggingFaceTB/SmolLM2-135M-Instruct comparing a CPU reference run against a Cloud TPU candidate run on identical inputs (not mocked or fabricated), without deploying a persistent HTTP inference server or running throughput benchmarks."
type = "binary"
weight = 1.0

[[criterion]]
description = "Verifies that the final response reports a passing numerical parity verdict (PASS), the top-1 token agreement, and the measured max_rel and max_abs differences for the logits and both hooked modules (model.layers.0.self_attn and model.layers.29.self_attn)."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
