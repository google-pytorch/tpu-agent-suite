[judge]
judge = "vertex_ai/gemini-3.8-flash"
atif-trajectory = "/logs/agent/trajectory.json"
timeout = 600

[[criterion]]
description = "Verifies that the inference workflow executed successfully on Cloud TPU in verification mode (not a failed run, crash, or mock/stub). The run must successfully deploy the model Qwen/Qwen3-0.6B, probe health successfully (HTTP 200), verify text generation completion from the served model, and tear down the server afterwards. The judge must cite the exact turn number (Step ID) where inference verification succeeded and report the verification result (e.g., status code and generated text completion or health status) in its reasoning."
type = "binary"
weight = 1.0

[[criterion]]
description = "Verifies that the model was deployed with the vLLM engine, not custom_fastapi: deployments.json sets engine to vllm, a launch_vllm.sh launcher (running `vllm serve`) was generated and submitted, and no custom FastAPI server (fastapi_server.py) was generated or deployed. The judge must cite the exact turn number (Step ID) where the vLLM deployment was submitted."
type = "binary"
weight = 1.0

[[criterion]]
description = "Verifies that the agent delivered a comprehensive final report to the user in the concluding turn of the conversation, summarizing the inference verification outcome and teardown status (rather than timing out or crashing). The judge must cite the exact turn number (Step ID) of the agent's final report to the user."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
