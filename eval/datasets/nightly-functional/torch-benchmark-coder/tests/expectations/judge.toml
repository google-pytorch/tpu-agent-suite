[judge]
judge = "vertex_ai/gemini-3.8-flash"
atif-trajectory = "/logs/agent/trajectory.json"
timeout = 600

[[criterion]]
description = "Synthesizes benchmark_tpu.py for Causal LM with PyTorch/TPU (torch_tpu) device placement and replaces the benchmark_model placeholder."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
