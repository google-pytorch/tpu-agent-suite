version = "1.0"

[task]
name = "nightly-close-gaps/close-gaps-gemma-4-31b-it"
description = "Optimize the 1k/1k serving throughput of an onboarded google/gemma-4-31B-it on vLLM on TPU, with the close-gaps skill when it is installed, starting from a provided onboarding (environment/onboarded)."

[metadata]
category = "nightly-close-gaps"

[agent]
# The timeout covers the weight download, vLLM startup, the optimization, the baseline and optimized benchmarks, and teardown.
# 6h base timeout (x3 timeout_multiplier = 18h on remote GKE).
timeout_sec = 21600.0

[verifier]
# Two LLM judges (with retries) and the speedup grader.
timeout_sec = 2400.0

[environment]
skills_dir = "/workspace/skills"
workdir = "/workspace"
cpus = 2
memory_mb = 65536
storage_mb = 102400
