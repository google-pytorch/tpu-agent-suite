version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "onboarding-routing/optimization-heuristics-decide-stated-traffic"
description = "For google/gemma-4-31B-it on tpu7x 2x2x1, tpu-diagnostics proposed serving changes from the baseline's trace (serving_candidates); its candidates.json is /workspace/optimization-heuristics/candidates.json. tpu-model-onboarding then measured candidate m-tp2xdp4 beside the baseline at the baseline's points, with serving_benchmark: the baseline's summary.json is /workspace/bench/baseline_summary.json and the candidate's is /workspace/bench/m-tp2xdp4_summary.json. Its candidate_report, the per-point comparison report.py wrote from those two summaries, is /workspace/bench/m-tp2xdp4_report.json. I care about serving throughput for long prompts at high concurrency: 8192:1024:128 (isl:osl:concurrency) is the traffic I serve. Decide which configuration to keep. This session has no TPU and no compute backend, so do not run or submit any compute job. Write /logs/artifacts/answer.json with keys `decision` (either \"keep m-tp2xdp4\" or \"keep baseline\"), `answer` (the decision and the per-point numbers) and `reference`."

[metadata]
category = "onboarding-routing"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
