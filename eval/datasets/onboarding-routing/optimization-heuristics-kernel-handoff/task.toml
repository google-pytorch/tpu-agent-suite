version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "onboarding-routing/optimization-heuristics-kernel-handoff"
description = "I onboarded google/gemma-4-31B-it with vLLM on tpu7x 2x2x1 (8 devices, 94.75 GiB HBM each) at TP 4 x DP 2, on image sha256:8e22f91d. The baseline server was launched from /workspace/inference/deployments.json and /workspace/inference/launch_vllm.sh and benchmarked at 1024:1024:32 and 8192:1024:128 (isl:osl:concurrency); its summary.json is /workspace/bench/baseline_summary.json. tpu-diagnostics profiled it; its profiling-result is /workspace/profile/profiling-result.json, and the decode attention kernel the server runs is /workspace/kernel/batched_rpa_decode.py. The optimization-heuristics round has already run: tpu-diagnostics proposed serving changes (/workspace/optimization-heuristics/candidates.json), and tpu-model-onboarding measured candidate m-tp2xdp4 against the baseline; its per-point report is /workspace/bench/m-tp2xdp4_report.json; its manifest and launch recipe are /workspace/optimization-heuristics/changes/m-tp2xdp4/deployments.json and launch_vllm.sh. TP 2 x DP 4 won at 8192:1024:128 and was kept. It has already been relaunched and re-profiled: that profiling-result is /workspace/profile/kept-m-tp2xdp4/profiling-result.json. 8192:1024:128 is the traffic I serve. Now optimize serving throughput with a custom Pallas kernel: generic compiler or runtime flags alone do not count as the optimization, and the optimized server must be re-benchmarked under exactly the same harness, concurrency levels and prompt settings as the baseline, with its output throughput compared against the baseline's. This session has no TPU and no compute backend, so do not run or submit any compute job. Decide what the kernel work runs on and start it: stop once the first tpu-kernel-development delegation has returned. Write /logs/artifacts/answer.json with keys `kernel_config` (the deployments.json path the kernel work runs on), `answer` and `reference`."

[metadata]
category = "onboarding-routing"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
