version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "onboarding-routing/optimization-heuristics-moe-dcp-guardrails"
description = "I onboarded zai-org/GLM-5-FP8 with disaggregated 1P1D vLLM-TorchTPU serving on two tpu7x 2x2x2 slices (16 devices per slice, 94.75 GiB HBM each) using TP=8, PCP=2, DCP=16, FP8 KV cache (36 GB per rank), max-model-len 202752, and MTP speculative decoding (3 draft tokens, 4 decode tokens per sequence). The launch manifest and script are /workspace/inference/deployments.json and /workspace/inference/launch_pd_1p1d.sh, and the model's config.json is /workspace/model/config.json. Decode XProf traces were already exported to Events DB parquets listed in /workspace/profile/profiling-result.json at two operating points (isl:osl:concurrency): 8192:8192:12 (48 decode tokens/step) and 8192:8192:20 (80 decode tokens/step). This session has no TPU and no compute backend, so do not run or submit any compute job. Run the serving optimization heuristics on the exported decode parquets and write /logs/artifacts/answer.json with keys `detector_ids` (list of firing detector IDs across both decode profiles), `decode_enable_expert_parallel` (boolean: whether to add `--enable-expert-parallel` on the decode engine at concurrency 20 / 80 decode tokens), `decode_dcp_size` (integer: recommended `DECODE_DCP_SIZE` for the small-batch c=12 regime), `prefill_dcp_size` (integer: `PREFILL_DCP_SIZE` to keep on the prefill engine so prefix-cache KV capacity is not halved), `allow_tp1_mesh` (boolean: whether TP=1 is valid on vllm-torchtpu), `answer` and `reference`."

[metadata]
category = "onboarding-routing"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
