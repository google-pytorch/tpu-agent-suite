version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "onboarding-routing/optimization-heuristics-not-after-onboarding-only"
description = "I asked for google/gemma-4-31B-it to be onboarded with vLLM on tpu7x 2x2x1 (8 devices, 94.75 GiB HBM each) and benchmarked at 1024:1024:32 and 8192:1024:128. tpu-model-onboarding has already finished that and left the server running (serving mode): its result is /workspace/onboarding-result.json, and the files it names are in /workspace. The model's config.json is /workspace/model/config.json. Finish my onboarding request from that result: I only want it onboarded and benchmarked. This session has no TPU and no compute backend, so do not run or submit any compute job. Write /logs/artifacts/answer.json with keys `answer` (what was done and anything worth trying next) and `reference`."

[metadata]
category = "onboarding-routing"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
