version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "onboarding-routing/optimization-heuristics-profile-with-candidates"
description = "I onboarded google/gemma-4-31B-it with vLLM on tpu7x 2x2x1 (8 devices, 94.75 GiB HBM each) at TP 4 x DP 2, on image sha256:8e22f91d. The baseline server is still running: job `golden-gemma4-a1b2c3d-serve` on the compute profile `default`, port 8000, profiler files on port 8790; it was launched from /workspace/inference/deployments.json and /workspace/inference/launch_vllm.sh, and benchmarked at two points (isl:osl:concurrency) 1024:1024:32 and 8192:1024:128, where throughput peaked in each regime. Nothing has profiled it yet. The model's config.json is /workspace/model/config.json. I want higher serving throughput. This session has no TPU and no compute backend, so do not run or submit any compute job, and decide what to work on first and start it: stop once the first specialist you send work to has returned, and do not measure anything. Summarize what you asked for in /logs/artifacts/answer.json with keys `answer` and `reference`."

[metadata]
category = "onboarding-routing"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
