version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "user-scope-install/agent-delegation"
description = "Answer a public TPU fact after a user-scope install, which the installed instructions route to the tpu-knowledge-base agent."

[metadata]
category = "user-scope-install"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
