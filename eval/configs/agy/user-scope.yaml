# A user-scope install, run inside the trial the way a user runs it
# (eval/agents/user_scope.py), with agy then started in /workspace, outside
# $HOME. For the user-scope-install dataset: whether the harness reads the
# memory and agents the installer put under $HOME. The agent runs in a pod on
# harbor-nexus-cluster, as agent-suite-remote.yaml does; no TPU cluster:
# nothing in that dataset touches a TPU.

job_name: torchtpu-antigravity-cli-user-scope
n_attempts: 1
agent_setup_timeout_multiplier: 5.0
timeout_multiplier: 3.0
n_concurrent_trials: 2
# As in agent-suite-remote.yaml: a corrupted download of the agy installer
# fails the agent before it runs (#526), and a fresh environment downloads it
# again.
retry:
  max_retries: 1
  include_exceptions: [NonZeroAgentExitCodeError]
environment:
  type: gke
  force_build: false
  kwargs:
    cluster_name: ${HARBOR_CLUSTER:-harbor-nexus-cluster}
    region: ${HARBOR_LOCATION:-us-central1}
    project_id: ${HARBOR_PROJECT:-tpu-nexus-767207}
    namespace: ${HARBOR_NAMESPACE:-default}
    registry_location: ${HARBOR_REGISTRY_LOCATION:-us}
    registry_name: ${HARBOR_REGISTRY:-harbor-nexus-eval}
  env:
    # Antigravity authenticates with ADC; run.py passes this to Harbor.
    AGY_ADC_AUTH: 'true'
  # run.py drops this mount, and the variables naming it, when it
  # authenticates with the GKE metadata server, as CI does.
  mounts:
  - type: bind
    source: ${HOST_ADC}
    target: /root/.config/gcloud/application_default_credentials.json
    read_only: true
verifier:
  env:
    VERTEXAI_PROJECT: ${VERTEXAI_PROJECT:-tpu-nexus-767207}
    VERTEXAI_LOCATION: ${VERTEXAI_LOCATION:-global}
    DEFAULT_MAX_RETRIES: '10'
    INITIAL_RETRY_DELAY: '2.0'
    MAX_RETRY_DELAY: '60.0'
agents:
- import_path: eval.agents.user_scope:UserScopeAntigravityCli
  model_name: gemini/gemini-4-argon-high
  env:
    AGENT_PERSONA: tpu-agent
    TPU_AGENT_SUITE_HOME: /root/.tpu-agent-suite
    PACKAGE_MANIFEST: ${PACKAGE_MANIFEST:-package.release.json}
    COMPUTE_BACKEND: local
    GKE_AUTH_ACCOUNT: ${GKE_AUTH_ACCOUNT:-adc}
    GEMINI_API_KEY: ${GEMINI_API_KEY}
    GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    GOOGLE_CLOUD_QUOTA_PROJECT: ${VERTEXAI_PROJECT:-tpu-nexus-767207}
    VERTEXAI_PROJECT: ${VERTEXAI_PROJECT:-tpu-nexus-767207}
    VERTEXAI_LOCATION: ${VERTEXAI_LOCATION:-global}
    # tpu-knowledge-base makes its own Claude calls on Vertex; Claude Code
    # sets these for itself, and Antigravity does not.
    ANTHROPIC_VERTEX_PROJECT_ID: ${VERTEXAI_PROJECT:-tpu-nexus-767207}
    CLOUD_ML_REGION: ${VERTEXAI_LOCATION:-global}
    EVAL_GIT_COMMIT: ${EVAL_GIT_COMMIT:-}
