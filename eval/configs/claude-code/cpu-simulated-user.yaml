# A CPU-only suite with a simulated user, for tasks whose answer only a user
# has. Harbor runs the user agent as the trial's agent and reaches the coding
# agent through an ACP bridge, so the coding agent sees a person it can ask.
#
# No compute backend is set: these tasks run in the trial's own container and
# touch no cluster, so nothing here needs a TPU, a kubeconfig or ADC.
#
#   ./eval/run.py -c claude-code/cpu-simulated-user \
#       -t tpu-hello-world/cpu-batch
#
# Single-step tasks only: harbor/trial/multi_step.py refuses the bridge.
version: '1.0'
job_name: torchtpu-claude-code-cpu-simulated-user
n_attempts: 1
n_concurrent_trials: 2

# Both agents authenticate to Vertex with the caller's ADC; without it the
# model call fails as "Could not refresh access token".
environment:
  mounts:
  - type: bind
    source: ${HOST_ADC}
    target: /root/.config/gcloud/application_default_credentials.json
    read_only: true

verifier:
  env:
    VERTEXAI_PROJECT: ${VERTEXAI_PROJECT:-tpu-nexus-767207}
    VERTEXAI_LOCATION: ${VERTEXAI_LOCATION:-global}
    DEFAULT_MAX_RETRIES: '10'
    INITIAL_RETRY_DELAY: '2.0'
    MAX_RETRY_DELAY: '60.0'

# The person. Its persona carries the decision the task withholds, so the
# coding agent can only get it by asking.
user_agent:
  name: claude-code
  model_name: anthropic/claude-opus-5-5[1m]
  user_persona_path: eval/configs/claude-code/simulated-user-persona.md
  bridge:
    kind: acp
  env:
    CLAUDE_CODE_USE_VERTEX: '1'
    ANTHROPIC_VERTEX_PROJECT_ID: ${VERTEXAI_PROJECT:-tpu-nexus-767207}
    CLOUD_ML_REGION: ${VERTEXAI_LOCATION:-global}
    ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5[1m]
    ANTHROPIC_DEFAULT_SONNET_MODEL: claude-opus-5-5[1m]
    GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: /root/.config/gcloud/application_default_credentials.json

agents:
- name: claude-code
  model_name: anthropic/claude-opus-5-5[1m]
  # The Claude Code release every trial installs: the CI E2E pin in
  # .ci/pins.conf, which run.py exports.
  kwargs:
    version: ${CLAUDE_CODE_VERSION}
  env:
    TPU_AGENT_SUITE_HOME: /root/.tpu-agent-suite
    PACKAGE_MANIFEST: ${PACKAGE_MANIFEST:-package.release.json}
    # The work happens in this container; staging would otherwise set
    # up a cluster profile for a task that never leaves it.
    COMPUTE_BACKEND: local
    CLAUDE_CODE_USE_VERTEX: '1'
    ANTHROPIC_VERTEX_PROJECT_ID: ${VERTEXAI_PROJECT:-tpu-nexus-767207}
    CLOUD_ML_REGION: ${VERTEXAI_LOCATION:-global}
    ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5[1m]
    ANTHROPIC_DEFAULT_SONNET_MODEL: claude-opus-5-5[1m]
    GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: /root/.config/gcloud/application_default_credentials.json
    CLAUDE_CODE_SUBAGENT_MODEL: claude-opus-5-5[1m]
    CLAUDE_CODE_SUBAGENT_MODEL_FORCE: '1'
    EVAL_GIT_COMMIT: ${EVAL_GIT_COMMIT:-}
