# A user-scope install, run inside the trial the way a user runs it
# (eval/agents/user_scope.py), with Codex then started in /workspace,
# outside $HOME. For the user-scope-install dataset. Needs OPENAI_API_KEY,
# which CI does not hold, so this one runs from a workstation only.

job_name: torchtpu-codex-user-scope
n_attempts: 1
n_concurrent_trials: 2
environment:
  mounts:
  - type: bind
    source: ${HOST_ADC}
    target: /root/.config/gcloud/application_default_credentials.json
    read_only: true
verifier:
  env:
    VERTEXAI_PROJECT: ${VERTEXAI_PROJECT:-tpu-nexus-767207}
    VERTEXAI_LOCATION: ${VERTEXAI_LOCATION:-global}
agents:
- import_path: eval.agents.user_scope:UserScopeCodex
  model_name: openai/gpt-5.5
  env:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    TPU_AGENT_SUITE_HOME: /root/.tpu-agent-suite
    PACKAGE_MANIFEST: ${PACKAGE_MANIFEST:-package.release.json}
    COMPUTE_BACKEND: local
    GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    VERTEXAI_PROJECT: ${VERTEXAI_PROJECT:-tpu-nexus-767207}
    VERTEXAI_LOCATION: ${VERTEXAI_LOCATION:-global}
    # tpu-knowledge-base makes its own Claude calls on Vertex.
    ANTHROPIC_VERTEX_PROJECT_ID: ${VERTEXAI_PROJECT:-tpu-nexus-767207}
    CLOUD_ML_REGION: ${VERTEXAI_LOCATION:-global}
    EVAL_GIT_COMMIT: ${EVAL_GIT_COMMIT:-}
