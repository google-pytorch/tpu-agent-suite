name: Bug Report
description: Report a bug or unexpected behavior in TPU Agent Suite
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected to happen instead.
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Agent Harness
      options:
        - claude-code
        - antigravity
        - codex
        - cursor
        - other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Compute Backend
      options:
        - local
        - gce_tpu_vm
        - gke_pod
        - gke_job
        - other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Commands, model ID, TPU topology, and package version (`tpu-agent-suite-build.json`).
    validations:
      required: true
