# Settings for the PR review bot (cbs-oss-review-bot). Every value below is
# the bot's default except `code_review_instructions`, which is empty here.
#
# The bot reviews each PR once on its own when it is ready for review (see
# `automatic_reviews`). To request another review manually, comment
# @cbs-oss-review-bot on the PR. To skip all reviews, add the
# `skip-review-bot` label.
#
# Format: one `setting: value` per line. A list goes on one line, separated
# by commas, in double quotes ("a, b"), not as a YAML list. An empty value
# is an empty list. `#` starts a comment. The file must stay valid YAML,
# because the check-yaml pre-commit hook checks it. Edits take effect once
# they merge into main.

# Where nits (optional polish) go: summary, inline or off.
nits: summary

# Where questions (things the bot could not confirm) go: summary, inline or off.
questions: summary

# Most inline comments in one review: a whole number from 0 to 30.
max_inline_comments: 30

# Problem labels that get inline comments: "blocking, should-fix" or "blocking".
inline_labels: "blocking, should-fix"

# Files the bot does not review: glob patterns, for example "docs/**, **/*.md".
ignore_paths:

# Shortest time between two reviews of one PR: 15 to 1440 minutes.
cooldown_minutes: 60

# Review ready PRs without being asked: on or off.
automatic_reviews: on

# More title words that stop an automatic review, for example "experimental, on hold".
# Already skipped without listing them: draft PRs, and titles with "WIP" or
# "draft" at the start or in brackets ([WIP], Draft:, (draft)), or with
# "do not review", "do not merge" or "do not submit" anywhere.
title_keywords_to_skip:

# Files the bot treats as code rules and checks every change against.
# Default: every AGENTS.md. Empty here: this repo's AGENTS.md files hold
# instructions for the TPU agent suite's own agents, not code review rules,
# so the bot is told not to apply them. Review rules live in REVIEW.md.
code_review_instructions:
