# Stable build of the standalone per-harness release archives, with the
# version taken as-is from package/package.release.json, so the archives come
# out as tpu-agent-suite-<harness>-v<version>.tar.gz and are published to
# GitHub Releases.
#
# Releases may only be cut from `main`, a `release/*` branch, or a `v<version>`
# tag matching `package/package.release.json`.
name: stable-release
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish compiled release archives to GitHub Releases'
        type: boolean
        default: true
      draft_release:
        description: 'Create the GitHub Release as a Draft for review before publishing'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  check-ref:
    name: check-ref
    runs-on: ubuntu-latest
    env:
      REF: ${{ github.ref }}
      PUBLISH_RELEASE: ${{ inputs.publish_release }}
    steps:
      - name: Require main, release/*, or a v<version> tag
        run: |
          case "$REF" in
            refs/heads/main|refs/heads/release/*|refs/tags/v[0-9]*)
              echo "Releasing from allowed ref pattern: $REF" ;;
            *)
              echo "::error::Stable releases may only be cut from main, release/*, or a v<version> tag (got $REF)."
              exit 1 ;;
          esac

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read version and verify tag matches package.release.json
        id: version
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys
          version = json.loads(pathlib.Path("package/package.release.json").read_text())["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"::error::{version!r} is not a stable X.Y.Z version")
              sys.exit(1)
          ref = os.environ["REF"]
          if ref.startswith("refs/tags/") and ref != f"refs/tags/v{version}":
              print(f"::error::Tag {ref} does not match package.release.json version v{version}.")
              sys.exit(1)
          print(f"Verified version {version} for ref {ref}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          PY

      - name: Validate release-notes/v<version>.md
        if: env.PUBLISH_RELEASE == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="release-notes/v${VERSION}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty. Add release notes (see release-notes/TEMPLATE.md) in the version-bump PR."
            exit 1
          fi
          if grep -qE 'vX\.Y\.Z|<!--' "$notes"; then
            echo "::error::$notes still contains template placeholders (vX.Y.Z or HTML comments)."
            exit 1
          fi

      - name: Upload release notes
        if: env.PUBLISH_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes-${{ steps.version.outputs.version }}
          path: release-notes/v${{ steps.version.outputs.version }}.md
          if-no-files-found: error
          retention-days: 14

  release:
    needs: check-ref
    uses: ./.github/workflows/release-archives.yml
    secrets:
      INTERNAL_DENYLIST_B64: ${{ secrets.INTERNAL_DENYLIST_B64 }}

  publish-release:
    name: publish-release
    needs: [check-ref, release]
    if: inputs.publish_release
    runs-on: ubuntu-latest
    environment: public-sync
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      DRAFT_RELEASE: ${{ inputs.draft_release }}
      REPO: ${{ github.repository }}
      PUBLIC_HARNESSES: claude-code antigravity
    steps:
      - name: Download verified release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tpu-agent-suite-${{ needs.release.outputs.version }}
          path: release-assets

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes-${{ needs.release.outputs.version }}
          path: release-notes

      - name: Publish release archives to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$PWD/release-notes/v${VERSION}.md"
          cd release-assets

          mkdir -p ../public-assets
          for harness in $PUBLIC_HARNESSES; do
            f="tpu-agent-suite-${harness}-v${VERSION}.tar.gz"
            if [ ! -f "$f" ]; then
              echo "::error::expected public archive $f was not built"
              exit 1
            fi
            grep -E "^[0-9a-f]{64}  ${f}\$" SHA256SUMS >> ../public-assets/SHA256SUMS
            cp -- "$f" ../public-assets/
          done
          cd ../public-assets
          sha256sum -c SHA256SUMS
          ls -lh -- *.tar.gz SHA256SUMS

          tag="v${VERSION}"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists in $REPO"
            exit 1
          fi
          draft_flag=()
          state="Published"
          if [ "$DRAFT_RELEASE" = "true" ]; then
            draft_flag=(--draft)
            state="Draft"
          fi
          gh release create "$tag" \
            --repo "$REPO" \
            --title "TPU Agent Suite ${tag}" \
            --notes-file "$notes" \
            "${draft_flag[@]}" \
            ./*.tar.gz SHA256SUMS
          {
            echo "## GitHub Release \`${tag}\` (${state})"
            echo
            echo "Published to \`${REPO}\` Releases (harnesses: ${PUBLIC_HARNESSES}):"
            echo
            for f in *.tar.gz SHA256SUMS; do echo "- \`$f\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
