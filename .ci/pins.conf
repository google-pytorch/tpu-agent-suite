#
# Harness CLI versions for CI and the Harbor evals. Sourced by the install
# scripts beside this file and parsed by eval/adapter/sitecustomize.py, so
# keep it to plain KEY=VALUE lines. Keep each version inside its range in
# package/package.release.json.

# Claude Code, from npm: install-claude.sh for CI, and for the Harbor evals
# eval/run.py exports it to the claude-code configs' agents[].kwargs.version.
# Pinned so the hand-back E2E tests get SubagentHandback
# (CLAUDE_HANDBACK_MIN_VERSION in test_hooks_e2e.py) and a red run is
# reproducible.
CLAUDE_CODE_VERSION=2.1.310

# Antigravity CLI (install-agy.sh), for CI and every Harbor trial. The vendor
# installer only serves the newest release, so the pin is a release path plus
# the tarball's SHA-512.
AGY_VERSION=1.4.7
AGY_URL=https://storage.googleapis.com/antigravity-public/antigravity-cli/1.4.7-5900205422411776/linux-x64/cli_linux_x64.tar.gz
AGY_SHA512=beda760587589f5827b0b516c3ec2c5bd5cd2e91eb0e2533807ba1e990a27dcd63aef0191e0b76fb60feab0d16eaa8210fb79842c34dd4809e257e1712edd152

# Binary patch for Harbor trials, which sign agy in with ADC. From 1.3.3, a
# fresh container in ADC mode reads every customization flag as disabled, so
# the suite's subagents, skills, rules and hooks are "not found or not allowed
# to be invoked". install-agy.sh rewrites these 27 bytes in
# applyModelBackendSelection so flag evaluation is always on. Same bytes in
# 1.4.0 and 1.4.7; empty both to skip the patch.
AGY_PATCH_BEFORE=84c07417488b54247848c7821802000001000000c6822101000001
AGY_PATCH_AFTER=488b542478c682210100000184c0740b48c7821802000001000000
