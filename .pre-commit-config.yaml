default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg
# Agent instructions/references are compiled verbatim into LLM context, so any
# reformatting changes what the model reads. Keep them byte-identical.
# Scoped to .md so Python under these paths is still formatted.
# The knowledge base raw/ snapshots are immutable ground truth sources that wiki
# pages cite; reformatting them would corrupt the record. Keep them byte-identical.
# Generated symbol catalogs are TSV, where a trailing tab is an empty final
# column: trimming it drops a field from every row. Keep them byte-identical.
exclude: ^package/(.*\.md$|data/knowledgebase/raw/|data/knowledgebase/wiki/codebases/.*/catalog/)
default_stages:
  - pre-commit # Run locally
  - manual # Run in CI
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
        exclude: ^mkdocs\.yml$ # Exclude mkdocs.yml from this check
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
        # A unified diff spells an unchanged blank line as one space; stripping
        # it leaves a patch that no longer applies.
        exclude: \.patch$
- repo: https://github.com/google/addlicense
  rev: v1.2.0
  hooks:
  - id: addlicense
    args: [ "-c", "Google LLC", "-l", "apache" ]
- repo: https://github.com/PyCQA/isort
  rev: 6.0.1
  hooks:
  - id: isort
- repo: https://github.com/google/yapf
  rev: v0.43.0
  hooks:
  - id: yapf
    args: [--in-place, --verbose]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.8
  hooks:
  - id: ruff
    args:
      - --output-format=github
      - --no-fix
      - --select=E,F,W
      - --ignore=E501,F841
      - --per-file-ignores=__init__.py:F401
      - --extend-per-file-ignores=package/scripts/tpu-kernel-development/*:F821,package/scripts/tpu-kernel-development/*:F401
  # Docstrings in framework/ follow the Google convention: a one-line summary
  # ending in a period, with Args:/Returns: sections only where the signature
  # is not self-explanatory. `__init__` is covered by its class docstring, and
  # tests are exempt from needing docstrings, though not from their format.
  - id: ruff
    name: ruff (framework docstrings)
    files: ^framework/
    args:
      - --output-format=github
      - --no-fix
      - --select=D
      - --ignore=D105,D107
      - --config=lint.pydocstyle.convention='google'
      - --per-file-ignores=framework/tests/*:D1
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v20.1.3
  hooks:
  - id: clang-format
    types_or: [c++, cuda]
    args: [--style=file, --verbose]
- repo: https://github.com/jackdewinter/pymarkdown
  rev: v0.9.29
  hooks:
  - id: pymarkdown
    args: [fix]
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.7
  hooks:
  - id: actionlint
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
    -   id: shellcheck
- repo: https://github.com/lk16/detect-missing-init
  rev: v0.1.6
  hooks:
  - id: detect-missing-init
    args: ['--create', "--track", "--python-folders", "framework"]
- repo: local
  hooks:
  - id: signoff-commit
    name: Sign-off Commit
    entry: bash
    args:
      - -c
      - |
        if ! grep -q "^Signed-off-by: $(git config user.name) <$(git config user.email)>" "$(git rev-parse --git-path COMMIT_EDITMSG)"; then
          printf "\nSigned-off-by: $(git config user.name) <$(git config user.email)>\n" >> "$(git rev-parse --git-path COMMIT_EDITMSG)"
        fi
    language: system
    verbose: true
    stages: [commit-msg]
  - id: check-filenames
    name: Check for spaces in all filenames
    entry: bash
    args:
      - -c
      - 'git ls-files | grep " " && echo "Filenames should not contain spaces!" && exit 1 || exit 0'
    language: system
    always_run: true
  - id: validate-knowledgebase
    name: Validate Knowledge Base Index & Log
    entry: python3 package/data/knowledgebase/scripts/validate_kb.py --check-git
    language: system
    always_run: true
    pass_filenames: false
  - id: check-denylist
    name: Check staged or pushed diff against internal denylist
    entry: python3 scripts/check_denylist.py --staged
    language: system
    always_run: true
    pass_filenames: false
    stages: [pre-commit, pre-push]
  - id: suggestion
    name: Suggestion
    entry: bash -c 'echo "To bypass pre-commit hooks, add --no-verify to git commit."'
    language: system
    verbose: true
    pass_filenames: false
  # Insert new entries above the `suggestion` entry
